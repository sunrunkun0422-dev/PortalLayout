<!doctype html><html lang="zh"><meta charset="utf-8"><title>双全景独立核验</title>
<style>body{font:16px sans-serif;margin:20px;color:#252525;background:white}header{border-bottom:2px solid #853e45;padding-bottom:12px}button,select,input{font:inherit;margin:5px;padding:6px}button{cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}canvas{width:100%;border:1px solid #bbb;touch-action:none}textarea{width:97%;height:65px;font:inherit}.warn{color:#853e45}#floor{width:60%;display:none}pre{white-space:pre-wrap;font-size:13px}.box{background:#f5f5f5;padding:10px}label{margin-right:12px}</style>
<header><b id="heading"></b> <span id="counter"></span><br>
审核者标识 <input id="reviewer" placeholder="独立审核者 ID">
<label><input type="checkbox" id="independent">本人独立完成本阶段核验</label>
<span id="importer" hidden>导入本人已提交的第一阶段 JSON <input id="stage1file" type="file" accept=".json"></span>
<button onclick="prev()">上一对</button><button onclick="next()">保存并下一对</button><button onclick="download()">导出本阶段原始记录</button></header>
<p id="instruction"></p><div class="grid"><div>图 A <canvas id="A" width="1024" height="512"></canvas></div><div>图 B <canvas id="B" width="1024" height="512"></canvas></div></div>
<div id="blindtools" class="box"><p>可在原图任意区域拖动框选，不限于检测器候选。A/B 框组成一组对应，可添加多组。</p>
<label><input type="checkbox" id="wrapA">A 框跨全景左右接缝（取外侧区间）</label><label><input type="checkbox" id="wrapB">B 框跨接缝</label><button onclick="addpair()">添加对应</button><button onclick="clearPairs()">清空对应</button>
<select id="decision"><option value="uncertain">无法确定</option><option value="match">存在对应（请画出）</option><option value="no_match">不存在对应</option></select><span id="paircount"></span></div>
<div id="gtools" class="box" hidden><p class="warn">第二阶段：以下为离线 GT 证据，不是模型输入。第一阶段记录已锁定；不确定不等于非相邻。</p>
真实关系 <select id="adj"><option>unknown</option><option>positive</option><option>negative</option></select>
可辨识性 <select id="ident"><option value="unreviewed">尚未核验</option><option value="clear_evidence">明确证据</option><option value="multiple_plausible">存在多解</option><option value="insufficient_evidence">证据不足</option></select>
<div id="targets"></div><label><input id="labelok" type="checkbox">已核对标注/归属/投影，未发现冲突</label><pre id="evidence"></pre></div>
<p>判断依据 / 分歧 / 图像异常（必须填写）</p><textarea id="reason"></textarea><p id="status" class="warn"></p><canvas id="floor" width="850" height="500"></canvas>
<script src="data.js"></script><script>
let pos=0,answers={},draft={},pairs=[],anchor=null,first=null,firstSha=null,loaded={};const $=id=>document.getElementById(id);const stage=DATA.stage;
$('heading').textContent=stage===1?'第一阶段：只看双张 RGB':'第二阶段：GT 核验';$('importer').hidden=stage!==2;$('blindtools').hidden=stage!==1;$('gtools').hidden=stage!==2;
$('instruction').textContent=stage===1?'不提供类别、房屋、位置、GT 或模型预测。请独立作答；不能依据上一阶段他人结果。':'必须先导入本人第一阶段记录。请逐个核对全部 GT 对应；几何可见性仅是代理，家具和门板遮挡需观察 RGB。';
function current(){return DATA.cases[pos]}
function reset(){draft={};pairs=[];$('reason').value='';$('decision').value='uncertain';$('adj').value='unknown';$('ident').value='unreviewed';$('labelok').checked=false;$('wrapA').checked=false;$('wrapB').checked=false}
function show(){if(stage===2&&!first){$('status').textContent='请先导入第一阶段记录。';return}reset();const c=current(),saved=answers[c.id];if(saved){pairs=saved.correspondences||[];$('reason').value=saved.evidence;$('decision').value=saved.decision||'uncertain';$('adj').value=saved.adjacency||'unknown';$('ident').value=saved.identifiability||'unreviewed';$('labelok').checked=!!saved.annotation_checked}
 $('counter').textContent=`${pos+1} / ${DATA.cases.length} · 已记录 ${Object.keys(answers).length}`;
 for(const side of ['A','B']){let im=new Image;im.onload=()=>{loaded[side]=im;draw(side)};im.src=c['image_'+side.toLowerCase()]}
 if(stage===2){$('targets').innerHTML='';for(let i=0;i<c.gt.correspondences.length;i++){let p=document.createElement('p');p.textContent=`GT ${i+1} 的图像可见性： `;for(const side of ['A','B']){let label=document.createElement('label');label.textContent=side;let sel=document.createElement('select');sel.id=`vis_${i}_${side}`;for(const [v,t]of [['uncertain','不确定'],['clear','清晰'],['partial','部分可见'],['not_visible','不可见']]){let op=new Option(t,v);sel.add(op)}sel.value=(saved&&saved.visibility_targets&&saved.visibility_targets[i]&&saved.visibility_targets[i][side])||'uncertain';label.append(sel);p.append(label)}$('targets').append(p)}
 $('evidence').textContent=JSON.stringify({annotation_adjacency:c.adjacency,scope:c.scope,proxy_only:c.gt.correspondences.map(v=>({A:v.A.proxy_visibility,B:v.B.proxy_visibility})),geometry_conflicts:c.conflicts,negative_certificate:c.negative_certificate,first_stage_locked:first.answers.find(x=>x.id===c.id)},null,2);drawFloor(c)}
 $('paircount').textContent=`已添加 ${pairs.length} 组`;}
function draw(side){const cv=$(side),ctx=cv.getContext('2d');ctx.clearRect(0,0,1024,512);if(loaded[side])ctx.drawImage(loaded[side],0,0,1024,512);ctx.lineWidth=3;ctx.font='bold 16px sans-serif';
 if(stage===2){for(let i=0;i<current().gt.correspondences.length;i++){const p=current().gt.correspondences[i][side].projection;ctx.strokeStyle='#00894b';if(p.sample_u&&p.top_v){for(const key of ['top_v','bottom_v']){ctx.beginPath();p.sample_u.forEach((u,j)=>{if(j===0||Math.abs(u-p.sample_u[j-1])>.5)ctx.moveTo(u*1023,p[key][j]*511);else ctx.lineTo(u*1023,p[key][j]*511)});ctx.stroke()}for(const j of [0,p.sample_u.length-1]){ctx.beginPath();ctx.moveTo(p.sample_u[j]*1023,p.top_v[j]*511);ctx.lineTo(p.sample_u[j]*1023,p.bottom_v[j]*511);ctx.stroke()}}else for(const [x,w]of spans(p))ctx.strokeRect(x*1023,120,w*1023,280);ctx.fillStyle='#00894b';ctx.fillText('GT '+(i+1),(p.start_u+.5*p.length_u)%1*1023,100)}}
 ctx.strokeStyle='#a44149';for(const p of pairs)rect(ctx,p[side]);if(draft[side])rect(ctx,draft[side])}
function spans(p){let e=p.start_u+p.length_u;return e<=1?[[p.start_u,p.length_u]]:[[p.start_u,1-p.start_u],[0,e-1]]}
function rect(ctx,p){for(const [x,w]of spans(p))ctx.strokeRect(x*1023,p.y0*511,w*1023,(p.y1-p.y0)*511)}
for(const side of ['A','B']){$(side).onpointerdown=e=>{if(stage!==1)return;let r=$(side).getBoundingClientRect();anchor=[side,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height];$(side).setPointerCapture(e.pointerId)};$(side).onpointerup=e=>{if(!anchor||anchor[0]!==side)return;let r=$(side).getBoundingClientRect(),x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height)),x0=Math.min(x,anchor[1]),x1=Math.max(x,anchor[1]);draft[side]={start_u:$('wrap'+side).checked?x1:x0,length_u:$('wrap'+side).checked?1-x1+x0:x1-x0,y0:Math.min(y,anchor[2]),y1:Math.max(y,anchor[2])};anchor=null;draw(side)}}
function addpair(){if(!draft.A||!draft.B){alert('请分别在 A/B 图上画框');return}pairs.push({...draft});draft={};$('decision').value='match';$('paircount').textContent=`已添加 ${pairs.length} 组`;draw('A');draw('B')}
function clearPairs(){pairs=[];draft={};draw('A');draw('B');$('paircount').textContent='已添加 0 组'}
function save(){if(!$('independent').checked){$('status').textContent='请先确认本人独立完成本阶段核验。';return false}const reviewer=$('reviewer').value.trim(),evidence=$('reason').value.trim();if(!reviewer||!evidence){$('status').textContent='请填写审核者与判断依据。';return false}if(stage===2&&(!first||first.reviewer_id!==reviewer)){alert('审核者必须与导入第一阶段一致');return false}if(stage===1&&$('decision').value==='match'&&!pairs.length){alert('存在对应时请添加自由框选的区域');return false}const item={id:current().id,evidence,timestamp:new Date().toISOString()};if(stage===1){item.decision=$('decision').value;item.correspondences=pairs;if(item.decision!=='match'&&pairs.length){alert('无匹配/不确定时请清空已声明对应，或改为存在对应');return false}}else{item.adjacency=$('adj').value;item.identifiability=$('ident').value;item.annotation_checked=$('labelok').checked;item.visibility_targets=current().gt.correspondences.map((v,i)=>({opening_ids:v.opening_ids,A:$(`vis_${i}_A`).value,B:$(`vis_${i}_B`).value}))}answers[item.id]=JSON.parse(JSON.stringify(item));$('status').textContent='本页已暂存；结束前请导出 JSON。';return true}
function prev(){if(pos>0){pos--;show()}}function next(){if(save()&&pos<DATA.cases.length-1){pos++;show()}}
function download(){if(!save())return;const obj={schema:'observable-review-v1',stage,reviewer_id:$('reviewer').value.trim(),reviewer_declares_independent_human_review:true,dataset_id:DATA.dataset_id,stage1_sha256:firstSha,answers:Object.values(answers)},blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`review_stage${stage}_${obj.reviewer_id}.json`;a.click()}
$('stage1file').onchange=async e=>{try{const f=e.target.files[0],bytes=await f.arrayBuffer(),o=JSON.parse(new TextDecoder().decode(bytes));if(o.stage!==1||o.dataset_id!==DATA.dataset_id||!o.reviewer_id)throw Error('文件阶段或数据版本不匹配');first=o;firstSha=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(v=>v.toString(16).padStart(2,'0')).join('');$('reviewer').value=o.reviewer_id;$('reviewer').readOnly=true;DATA.cases=DATA.cases.filter(c=>o.answers.some(r=>r.id===c.id));pos=0;$('status').textContent='第一阶段记录已导入并锁定。';show()}catch(err){alert(err.message)}};
function drawFloor(c){const cv=$('floor'),ctx=cv.getContext('2d');cv.style.display='block';ctx.clearRect(0,0,850,500);let polys=c.gt.unit_boundaries_floor.filter(Boolean),pts=polys.flat();if(!pts.length)return;let xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),loX=Math.min(...xs),hiX=Math.max(...xs),loY=Math.min(...ys),hiY=Math.max(...ys),scale=Math.min(780/(hiX-loX||1),430/(hiY-loY||1));const xy=p=>[35+(p[0]-loX)*scale,465-(p[1]-loY)*scale];polys.forEach((poly,i)=>{ctx.strokeStyle=i?'#6b6b9a':'#984b50';ctx.lineWidth=2;ctx.beginPath();poly.forEach((p,j)=>{let q=xy(p);j?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.stroke()});ctx.strokeStyle='#00894b';ctx.lineWidth=5;for(const m of c.gt.all_geometry_matches)for(const key of ['opening_a','opening_b']){let q=m[key].floor_endpoints.map(xy);ctx.beginPath();ctx.moveTo(...q[0]);ctx.lineTo(...q[1]);ctx.stroke()}}
show();
</script></html>
