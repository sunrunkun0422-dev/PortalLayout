<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>R06 跨房门后结构核验</title>
<style>
body{font:15px system-ui,sans-serif;margin:1.2em;background:#f4f6f8;color:#15212d}header,section{background:white;padding:1em;margin:.8em 0;border-radius:8px}h1{font-size:1.4em}p{margin:.4em 0}button,select,input,textarea{font:inherit;padding:.35em;margin:.2em}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:.3em}.images{display:grid;grid-template-columns:1fr 1fr;gap:8px}.panel{min-width:0}canvas{width:100%;height:auto;background:#222;display:block}.active{outline:4px solid #ef4444}label{display:inline-block;margin:.25em}.hint{color:#765619}.meta{word-break:break-all;color:#405367;font-size:.88em}textarea{width:95%;height:3em}@media(max-width:900px){.images{grid-template-columns:1fr}}
</style>
<header><h1>R06 跨房门后结构人工核验</h1><p class="hint">黄色虚线是自动几何代理的开口投影，可能错误；它不是人工确认。请核对对应和目标空间归属。图上红线是审核者在来源图中点击的墙地边界。</p><p>判断方向时，“来源”是在其中寻找门后结构的图；“目标”是该结构所属房间的图。先核验开口，再分别审核 A→B 和 B→A。不能确认请选择“不确定”。</p></header>
<section><div class="toolbar"><button id="prev">上一例</button><button id="next">下一例</button><label>编号 <input id="jump" type="number" min="1" style="width:5em"></label><button id="go">跳转</button><label>批次 <select id="batch"><option value="initial">初始 200</option><option value="reserve">预留 200</option></select></label><strong id="position"></strong></div><p class="meta" id="meta"></p><div class="images"><div class="panel"><h3 id="titleA"></h3><canvas id="canvasA" width="1024" height="512"></canvas><p class="meta" id="pathA"></p></div><div class="panel"><h3 id="titleB"></h3><canvas id="canvasB" width="1024" height="512"></canvas><p class="meta" id="pathB"></p></div></div></section>
<section><div><label>共享开口判断 <select id="shared"><option value="">待审核</option><option value="yes">是</option><option value="no">否</option><option value="uncertain">不确定</option></select></label><label>开口备注 <input id="sharedNote" size="50"></label></div><div class="toolbar"><strong>当前方向：</strong><select id="direction"><option value="a_to_b">A → B（在 A 图找 B 房间结构）</option><option value="b_to_a">B → A（在 B 图找 A 房间结构）</option></select><span id="sourceLabel"></span></div><div><label>补充结构 <select id="status"><option value="">待审核</option><option value="available">可见且可标注</option><option value="unavailable">不可用</option><option value="uncertain">不确定</option></select></label><label>遮挡 <select id="occlusion"><option value="">待审核</option><option value="clear">无遮挡或不影响</option><option value="partial">部分遮挡</option><option value="blocked">完全遮挡</option><option value="uncertain">不确定</option></select></label><label>属于目标房间 <select id="belongs"><option value="">待审核</option><option value="yes">是</option><option value="no">否</option><option value="uncertain">不确定</option></select></label></div><p>在红框来源图上依次点击边界点；可跨接缝，坐标按图像宽高归一化。若存在多段不连续边界，请在备注中说明；本版记录一条连续折线。</p><button id="undo">撤销末点</button><button id="clear">清除当前方向点</button><span id="points"></span><div><textarea id="note" placeholder="标注依据、遮挡、歧义或其他备注"></textarea></div></section>
<section><div class="toolbar"><label>审核者 ID <input id="reviewer" placeholder="必填，不能冒充他人"></label><button id="download">导出审核 JSON</button><label>导入已有审核 <input id="import" type="file" accept="application/json"></label><span id="progress"></span></div><p>填写自动保存在当前浏览器；清除浏览器数据可能丢失记录，必须导出 JSON。预留批次只有在初始批次支持不足时启用，两个批次应分别报告。</p></section>
<script>
'use strict';
const PACK=__PACK_PAYLOAD__;
const $=id=>document.getElementById(id), storeKey='portallayout-r06-'+PACK.pack_id;
let all={}; try{all=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch(e){console.error(e)}
let index=0, direction='a_to_b', images={a:new Image(),b:new Image()}, serial=0;
function initialDir(){return {status:'',occlusion:'',belongs:'',points:[],note:''}}
function getState(c){if(!all[c.case_id])all[c.case_id]={shared:'',shared_note:'',a_to_b:initialDir(),b_to_a:initialDir()};return all[c.case_id]}
function persist(){localStorage.setItem(storeKey,JSON.stringify(all)); updateProgress()}
function cases(){return PACK.cases.filter(c=>c.batch===$('batch').value)}
function current(){return cases()[index]}
function draw(side){let canvas=$('canvas'+side.toUpperCase()),ctx=canvas.getContext('2d'),img=images[side],c=current();ctx.clearRect(0,0,1024,512);if(img.complete&&img.naturalWidth)ctx.drawImage(img,0,0,1024,512);let p=c.opening_proxy['projection_'+side];ctx.strokeStyle='#ffdf00';ctx.lineWidth=4;ctx.setLineDash([12,7]);for(let k=0;k<2;k++){let x=p.endpoint_u[k]*1024;ctx.beginPath();ctx.moveTo(x,p.top_v[k]*512);ctx.lineTo(x,p.bottom_v[k]*512);ctx.stroke()}ctx.setLineDash([]);let source=direction==='a_to_b'?'a':'b';canvas.classList.toggle('active',source===side);if(source===side){let pts=getState(c)[direction].points;ctx.strokeStyle='#ff4040';ctx.fillStyle='#ff4040';ctx.lineWidth=3;ctx.beginPath();pts.forEach((pt,i)=>{let x=pt[0]*1024,y=pt[1]*512;if(i===0||Math.abs(pt[0]-pts[i-1][0])>.5)ctx.moveTo(x,y);else ctx.lineTo(x,y);ctx.fillRect(x-3,y-3,6,6)});ctx.stroke()}}
function fill(){let c=current();if(!c)return;let s=getState(c), d=s[direction];$('position').textContent=`${index+1}/${cases().length}，全包编号 ${c.sample_index}`;$('jump').value=index+1;$('meta').textContent=`房屋 ${c.house_id} · 楼层 ${c.floor_uid} · 角色 ${c.role} · 样本 ${c.case_id} · ${c.opening_proxy.kind}`;for(let side of ['a','b']){$('title'+side.toUpperCase()).textContent=`图 ${side.toUpperCase()} / ${c['observation_'+side]}`;$('path'+side.toUpperCase()).textContent=c['image_'+side+'_relative'];} $('shared').value=s.shared;$('sharedNote').value=s.shared_note;$('direction').value=direction;$('status').value=d.status;$('occlusion').value=d.occlusion;$('belongs').value=d.belongs;$('note').value=d.note;$('points').textContent=`当前 ${d.points.length} 点`;$('sourceLabel').textContent=direction==='a_to_b'?'来源 A，目标 B':'来源 B，目标 A';$('prev').disabled=index===0;$('next').disabled=index===cases().length-1;const n=++serial;for(let side of ['a','b']){let img=new Image();images[side]=img;img.onload=()=>{if(n===serial)draw(side)};img.src=c['image_'+side];draw(side)}updateProgress()}
function saveFields(){let s=getState(current()),d=s[direction];s.shared=$('shared').value;s.shared_note=$('sharedNote').value;d.status=$('status').value;d.occlusion=$('occlusion').value;d.belongs=$('belongs').value;d.note=$('note').value;persist()}
function updateProgress(){let count=cases().filter(c=>{let s=all[c.case_id];return s&&s.shared&&s.a_to_b.status&&s.b_to_a.status}).length;$('progress').textContent=`本批两方向均有初判：${count}/${cases().length}`}
for(let id of ['shared','sharedNote','status','occlusion','belongs','note'])$(id).addEventListener('input',saveFields);
$('direction').onchange=()=>{saveFields();direction=$('direction').value;fill()};
$('prev').onclick=()=>{saveFields();if(index>0)index--;fill()};$('next').onclick=()=>{saveFields();if(index<cases().length-1)index++;fill()};$('go').onclick=()=>{saveFields();index=Math.max(0,Math.min(cases().length-1,Number($('jump').value)-1||0));fill()};$('batch').onchange=()=>{index=0;fill()};
for(let side of ['a','b'])$('canvas'+side.toUpperCase()).onclick=e=>{if((direction==='a_to_b'?'a':'b')!==side)return;let rect=e.currentTarget.getBoundingClientRect();let x=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width)),y=Math.max(0,Math.min(1,(e.clientY-rect.top)/rect.height));getState(current())[direction].points.push([+x.toFixed(6),+y.toFixed(6)]);persist();fill()};
$('undo').onclick=()=>{getState(current())[direction].points.pop();persist();fill()};$('clear').onclick=()=>{getState(current())[direction].points=[];persist();fill()};
$('download').onclick=()=>{saveFields();let reviewer=$('reviewer').value.trim();if(!reviewer){alert('请填写审核者 ID');return}let invalid=PACK.cases.filter(c=>{let s=all[c.case_id];return s&&['a_to_b','b_to_a'].some(k=>s[k].status==='available'&&(s.shared!=='yes'||s[k].points.length<2||s[k].belongs!=='yes'||!['clear','partial'].includes(s[k].occlusion)))});if(invalid.length){alert('可用样本须确认共享开口和目标归属、标记至少两个边界点，并确认无遮挡或部分遮挡；首个错误样本 '+invalid[0].sample_index);return}let data={schema:'r06-human-review.v1',pack_id:PACK.pack_id,reviewer,exported_at:new Date().toISOString(),cases:PACK.cases.filter(c=>all[c.case_id]).map(c=>({case_id:c.case_id,...all[c.case_id]}))};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='r06_review_'+reviewer.replace(/[^a-zA-Z0-9_-]/g,'_')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('import').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(data.schema!=='r06-human-review.v1'||data.pack_id!==PACK.pack_id)throw Error('审查包身份不匹配');let valid=new Set(PACK.cases.map(c=>c.case_id));for(let r of data.cases){if(!valid.has(r.case_id))throw Error('未知样本 ID');let {case_id,...s}=r;all[case_id]=s}$('reviewer').value=data.reviewer||'';persist();fill()}catch(err){alert('导入失败：'+err.message)}};
fill();
</script></html>
